name: Build and deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test
      - name: Test lesson evaluation gates
        run: npm run test:lesson-eval
      - name: Verify caching release evidence
        run: npm run eval:lessons -- check-release caching evals/lessons/releases/caching
      - name: Verify queue release evidence
        run: npm run eval:lessons -- check-release queues evals/lessons/releases/queues
      - name: Verify load-balancing release evidence
        run: npm run eval:lessons -- check-release load-balancing evals/lessons/releases/load-balancing
      - name: Verify API gateway release evidence
        run: npm run eval:lessons -- check-release api-gateways evals/lessons/releases/api-gateways
      - name: Verify DNS release evidence
        run: npm run eval:lessons -- check-release dns evals/lessons/releases/dns
      - name: Verify CDN and HTTP caching release evidence
        run: npm run eval:lessons -- check-release cdn-http-caching evals/lessons/releases/cdn-http-caching
      - name: Verify client-server release evidence
        run: npm run eval:lessons -- check-release client-server evals/lessons/releases/client-server
      - name: Verify api-server release evidence
        run: npm run eval:lessons -- check-release api-server evals/lessons/releases/api-server
      - name: Verify databases release evidence
        run: npm run eval:lessons -- check-release databases evals/lessons/releases/databases
      - name: Verify cap release evidence
        run: npm run eval:lessons -- check-release cap evals/lessons/releases/cap
      - name: Verify replication release evidence
        run: npm run eval:lessons -- check-release replication evals/lessons/releases/replication
      - name: Verify postgresql release evidence
        run: npm run eval:lessons -- check-release postgresql evals/lessons/releases/postgresql
      - name: Verify sqlite release evidence
        run: npm run eval:lessons -- check-release sqlite evals/lessons/releases/sqlite
      - name: Verify mysql release evidence
        run: npm run eval:lessons -- check-release mysql evals/lessons/releases/mysql
      - name: Build for the repository URL
        run: npm run build -- --base /distributed-sim/
      - name: Upload site artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
